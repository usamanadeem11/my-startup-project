<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - CUP</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<!-- AOS -->
<link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- ================= FORM SECTION ================= -->
<section class="form-section">

<div class="container">

<div class="form-card" data-aos="zoom-in">

<h2 class="text-center mb-4">Start Your Journey</h2>

<form>

<!-- NAME -->
<div class="mb-3">
<label>Name</label>
<input type="text" class="form-control" placeholder="Enter your name" required>
</div>

<!-- PHONE -->
<div class="mb-3">
<label>Phone</label>
<input type="text" class="form-control" placeholder="Enter phone number" required>
</div>

<!-- EMAIL -->
<div class="mb-3">
<label>Email</label>
<input type="email" class="form-control" placeholder="Enter your email" required>
</div>

<!-- LOCATION -->
<div class="mb-3">
<label>Location Type</label>
<select id="location" class="form-select">
<option value="">Select Location</option>
<option value="village">Village</option>
<option value="town">Town</option>
<option value="city">City</option>
</select>
</div>

<!-- CATEGORY -->
<div class="mb-3">
<label>Category</label>
<select id="category" class="form-select">
<option value="">Select Category</option>
<option value="business">Business & Income</option>
<option value="jobs">Jobs & Career</option>
<option value="education">Education</option>
<option value="health">Health & Wellness</option>
<option value="special">Special Programs</option>
</select>
</div>

<!-- SERVICE -->
<div class="mb-3">
<label>Choose Service</label>
<select id="service" class="form-select">
<option>Select Location & Category first</option>
</select>
</div>

<!-- SUBMIT -->
<button class="btn submit-btn w-100">Register Now</button>

</form>

</div>

</div>

</section>

<!-- ================= JS ================= -->
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

<script>
AOS.init();

/* ================= FULL SERVICE DATABASE ================= */

const services = {

village: {
business: [
"Fish Farming","Poultry Farming","Goat Farming","Dairy Business",
"Mushroom Farming","Beekeeping","Vegetable Farming","Fruit Farming",
"Pickle Making","Spice Making","Papad Making","Agarbatti Making",
"Candle Making","Gobar Products","Vermi Compost","Tea Stall",
"Food Cart","Juice Stall","Small Grocery Shop"
],

jobs: [
"Local Job Support","Skill Based Job","Helper Jobs"
],

education: [
"Basic Education","10th Coaching","12th Coaching"
],

health: [
"Yoga","Meditation","Basic Fitness","Body Remedies"
],

special: [
"Madarsa Student Program","Beginner Support"
]
},

town: {
business: [
"Laundry","Salon","Beauty Parlour","Tiffin Service",
"Cloud Kitchen","Bakery","Confectionery","Restaurant",
"Garments Business","Jewelry Business","Mini Supermarket",
"Stationery Shop","Printing Shop","Food Stall"
],

jobs: [
"Jobs in India","Office Jobs","Retail Jobs","Delivery Jobs"
],

education: [
"10th Coaching","12th Coaching","Computer Classes",
"Spoken English"
],

health: [
"Gym","Yoga Classes","Meditation","Fitness Training"
],

special: [
"Madarsa Students","Skill Training"
]
},

city: {
business: [
"Startup Business","Restaurant","Cloud Kitchen",
"Automobile Garage","Advanced Laundry","Franchise Business"
],

jobs: [
"Corporate Jobs","Jobs Abroad","IT Jobs","Freelancing"
],

education: [
"IAS Preparation","IPS Preparation","Govt Exams",
"Advanced Coaching"
],

health: [
"Advanced Fitness","Personal Trainer","Mental Coaching"
],

special: [
"Madarsa Students","Career Guidance"
]
}

};

/* ================= FILTER LOGIC ================= */

const locationEl = document.getElementById("location");
const categoryEl = document.getElementById("category");
const serviceEl = document.getElementById("service");

function updateServices() {

const loc = locationEl.value;
const cat = categoryEl.value;

serviceEl.innerHTML = "<option>Select Service</option>";

if (services[loc] && services[loc][cat]) {

services[loc][cat].forEach(service => {
let option = document.createElement("option");
option.text = service;
serviceEl.add(option);
});

}

}

locationEl.addEventListener("change", updateServices);
categoryEl.addEventListener("change", updateServices);

</script>

<script>
document.querySelector("form").addEventListener("submit", async function(e){

e.preventDefault();

const data = {
name: document.querySelectorAll("input")[0].value,
phone: document.querySelectorAll("input")[1].value,
email: document.querySelectorAll("input")[2].value,
location: document.getElementById("location").value,
category: document.getElementById("category").value,
service: document.getElementById("service").value
};

const res = await fetch("http://localhost:5000/register", {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify(data)
});

const result = await res.json();
alert(result.message);

});
</script>

</body>
</html>
